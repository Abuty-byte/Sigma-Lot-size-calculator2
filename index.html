
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>SIGMA LOTS CALCULATOR</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
}

.card {
  max-width: 430px;
  margin: 30px auto;
  padding: 25px;
  background: #151515;
  border: 1px solid #b99745;
  border-radius: 16px;
}

h1 {
  color: #d4af37;
  text-align: center;
  font-size: 25px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  margin-bottom: 25px;
}

label {
  display: block;
  margin: 15px 0 7px;
  color: #d4af37;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #555;
  border-radius: 8px;
  background: #222;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  border: none;
  border-radius: 8px;
  background: #d4af37;
  color: #000;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.result {
  margin-top: 20px;
  padding: 18px;
  background: #222;
  border-radius: 10px;
  text-align: center;
}

.result h2 {
  color: #d4af37;
}

.warning {
  color: #ff6868;
  text-align: center;
  margin-top: 12px;
}

#installBtn {
  display: none;
  background: #fff;
}

footer {
  text-align: center;
  color: #888;
  margin-top: 25px;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="card">

<h1>SIGMA LOTS CALCULATOR</h1>
<p class="subtitle">Calculate your risk. Control your trades.</p>

<label>Account Balance ($)</label>
<input type="number" id="balance" placeholder="Enter account balance">

<label>Risk Percentage (%)</label>
<input type="number" id="risk" placeholder="Enter risk percentage">

<label>Trading Instrument</label>
<select id="pair">
  <option value="" selected disabled>Select instrument</option>
  <option value="XAUUSD">XAUUSD</option>
  <option value="EURUSD">EURUSD</option>
  <option value="GBPUSD">GBPUSD</option>
  <option value="AUDUSD">AUDUSD</option>
  <option value="NZDUSD">NZDUSD</option>
  <option value="USDJPY">USDJPY</option>
  <option value="USDCAD">USDCAD</option>
  <option value="USDCHF">USDCHF</option>
</select>

<label>Entry Price</label>
<input type="number" id="entry" placeholder="Enter entry price" step="any">

<label>Stop Loss Price</label>
<input type="number" id="stop" placeholder="Enter stop loss price" step="any">

<button onclick="calculate()">CALCULATE LOT SIZE</button>

<button id="installBtn">INSTALL APP</button>

<p class="warning" id="warning"></p>

<div class="result" id="result" style="display:none;">
  <h2 id="lotResult"></h2>
  <p id="riskResult"></p>
</div>

<footer>
  NO CHASING. NO GUESSING. JUST DISCIPLINE.
</footer>

</div>

<script>
function calculate() {
  const balanceInput = document.getElementById("balance").value;
  const riskInput = document.getElementById("risk").value;
  const pair = document.getElementById("pair").value;
  const entryInput = document.getElementById("entry").value;
  const stopInput = document.getElementById("stop").value;

  const warning = document.getElementById("warning");
  const result = document.getElementById("result");

  warning.textContent = "";
  result.style.display = "none";

  if (balanceInput === "") {
    warning.textContent = "Please enter your account balance.";
    return;
  }

  if (riskInput === "") {
    warning.textContent = "Please enter your risk percentage.";
    return;
  }

  if (!pair) {
    warning.textContent = "Please select a trading instrument.";
    return;
  }

  if (entryInput === "") {
    warning.textContent = "Please enter your entry price.";
    return;
  }

  if (stopInput === "") {
    warning.textContent = "Please enter your stop-loss price.";
    return;
  }

  const balance = Number(balanceInput);
  const risk = Number(riskInput);
  const entry = Number(entryInput);
  const stop = Number(stopInput);

  if (!Number.isFinite(balance) || balance <= 0) {
    warning.textContent = "Enter a valid account balance.";
    return;
  }

  if (!Number.isFinite(risk) || risk <= 0 || risk > 100) {
    warning.textContent = "Risk must be greater than 0 and no more than 100%.";
    return;
  }

  if (!Number.isFinite(entry) || entry <= 0 ||
      !Number.isFinite(stop) || stop <= 0) {
    warning.textContent = "Enter valid entry and stop-loss prices.";
    return;
  }

  if (entry === stop) {
    warning.textContent = "Entry and stop-loss cannot be the same.";
    return;
  }

  const riskCash = balance * risk / 100;
  const distance = Math.abs(entry - stop);

  let lossPerLot;

  if (pair === "XAUUSD") {
    lossPerLot = distance * 100;
  } else {
    const pipSize = pair.includes("JPY") ? 0.01 : 0.0001;
    const pips = distance / pipSize;

    let pipValue;

    if (["EURUSD", "GBPUSD", "AUDUSD", "NZDUSD"].includes(pair)) {
      pipValue = 10;
    } else if (pair === "USDJPY") {
      pipValue = 10 / entry;
    } else if (["USDCAD", "USDCHF"].includes(pair)) {
      pipValue = 10 / entry;
    }

    lossPerLot = pips * pipValue;
  }

  if (!Number.isFinite(lossPerLot) || lossPerLot <= 0) {
    warning.textContent = "Unable to calculate. Check your prices.";
    return;
  }

  const rawLots = riskCash / lossPerLot;
  const lots = Math.floor(rawLots * 100) / 100;

  document.getElementById("lotResult").textContent =
    "Lot Size: " + lots.toFixed(2);

  document.getElementById("riskResult").textContent =
    "Risk Amount: $" + riskCash.toFixed(2);

  result.style.display = "block";
}
</script>

<script>
let deferredPrompt;

const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredPrompt = event;
  installBtn.style.display = "block";
});

installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;

  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = "none";
});
</script>

</body>
</html>
